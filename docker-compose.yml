services:

  # ═══════════════════════════════════════════════════════════════
  # ORACLE XE EU — PRIMARY
  # ═══════════════════════════════════════════════════════════════
  oracle-eu:
    image: gvenzl/oracle-xe:21-full
    container_name: oracle-eu-primary
    environment:
      - ORACLE_PASSWORD=CloudOps2025
      - ORACLE_DATABASE=CLOUDOPS
      - APP_USER=incidents_app
      - APP_USER_PASSWORD=AppIncidents2025
    ports:
      - "1521:1521"
    volumes:
      - oracle-eu-data:/opt/oracle/oradata
      - ./oracle/init:/container-entrypoint-initdb.d
    networks:
      - cloudops-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/healthcheck.sh"]
      interval: 20s
      timeout: 15s
      retries: 40
      start_period: 300s

  # ═══════════════════════════════════════════════════════════════
  # ORACLE XE AF — STANDBY Afrique
  # ═══════════════════════════════════════════════════════════════
  oracle-af:
    image: gvenzl/oracle-xe:21-full
    container_name: oracle-af-standby
    environment:
      - ORACLE_PASSWORD=CloudOps2025
      - ORACLE_DATABASE=CLOUDOPSAF
      - APP_USER=incidents_app
      - APP_USER_PASSWORD=AppIncidents2025
      - ORACLE_SGA_TARGET=512m
      - ORACLE_PGA_AGGREGATE_TARGET=256m
    ports:
      - "1522:1521"
    volumes:
      - oracle-af-data:/opt/oracle/oradata
    networks:
      - cloudops-network
    depends_on:
      oracle-eu:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/healthcheck.sh"]
      interval: 20s
      timeout: 15s
      retries: 40
      start_period: 360s

  # ═══════════════════════════════════════════════════════════════
  # ORACLE XE US — STANDBY Amerique
  # ═══════════════════════════════════════════════════════════════
  oracle-us:
    image: gvenzl/oracle-xe:21-full
    container_name: oracle-us-standby
    environment:
      - ORACLE_PASSWORD=CloudOps2025
      - ORACLE_DATABASE=CLOUDOPSUS
      - APP_USER=incidents_app
      - APP_USER_PASSWORD=AppIncidents2025
      - ORACLE_SGA_TARGET=512m
      - ORACLE_PGA_AGGREGATE_TARGET=256m
    ports:
      - "1523:1521"
    volumes:
      - oracle-us-data:/opt/oracle/oradata
    networks:
      - cloudops-network
    depends_on:
      oracle-eu:
        condition: service_healthy
      oracle-af:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/healthcheck.sh"]
      interval: 20s
      timeout: 15s
      retries: 40
      start_period: 360s

  # ═══════════════════════════════════════════════════════════════
  # KEYCLOAK DB — PostgreSQL
  # ═══════════════════════════════════════════════════════════════
  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-db
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=password
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    networks:
      - cloudops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════
  # KEYCLOAK
  # ═══════════════════════════════════════════════════════════════
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.7
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=password
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_HTTP_PORT=8180
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - cloudops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8180 && echo -e 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 20s
      timeout: 15s
      retries: 30
      start_period: 180s

  # ═══════════════════════════════════════════════════════════════
  # ZOOKEEPER
  # ═══════════════════════════════════════════════════════════════
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 4000
      KAFKA_OPTS: "-Dzookeeper.forceSync=no"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - cloudops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1024M

  # ═══════════════════════════════════════════════════════════════
  # KAFKA
  # ═══════════════════════════════════════════════════════════════
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9999:9999"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_JMX_PORT=9999
      - KAFKA_JMX_HOSTNAME=kafka
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - cloudops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════
  # KAFKA JMX EXPORTER
  # ═══════════════════════════════════════════════════════════════
  kafka-jmx-exporter:
    image: bitnami/jmx-exporter:latest
    container_name: kafka-jmx-exporter
    ports:
      - "9404:9404"
    volumes:
      - ./kafka/jmx-exporter-config.yml:/opt/bitnami/jmx-exporter/config.yml
    networks:
      - cloudops-network
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # REDIS
  # ═══════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - cloudops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ═══════════════════════════════════════════════════════════════
  # INCIDENT SERVICE
  # ═══════════════════════════════════════════════════════════════
  incident-service:
    build:
      context: .
      dockerfile: incident-service/Dockerfile
    container_name: incident-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8082
      - ORACLE_EU_URL=jdbc:oracle:thin:@//oracle-eu:1521/XEPDB1
      - ORACLE_EU_USERNAME=incidents_app
      - ORACLE_EU_PASSWORD=AppIncidents2025
      - ORACLE_AF_URL=jdbc:oracle:thin:@//oracle-af:1521/XEPDB1
      - ORACLE_AF_USERNAME=incidents_app
      - ORACLE_AF_PASSWORD=AppIncidents2025
      - ORACLE_US_URL=jdbc:oracle:thin:@//oracle-us:1521/XEPDB1
      - ORACLE_US_USERNAME=incidents_app
      - ORACLE_US_PASSWORD=AppIncidents2025
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.OracleDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_FLYWAY_ENABLED=false
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8180/realms/cloudops-realm
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8180/realms/cloudops-realm/protocol/openid-connect/certs
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_KAFKA_PRODUCER_KEY_SERIALIZER=org.apache.kafka.common.serialization.StringSerializer
      - SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER=org.springframework.kafka.support.serializer.JsonSerializer
      - SPRING_KAFKA_PRODUCER_PROPERTIES_SPRING_JSON_ADD_TYPE_HEADERS=false
      - LOGGING_LEVEL_IO_CLOUDOPS=DEBUG
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=*
      - MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true
      - MANAGEMENT_SERVER_PORT=8090
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED=true
      - MANAGEMENT_HEALTH_READINESSSTATE_ENABLED=true
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_SECURITY_ENABLED=false
      - SPRING_SECURITY_IGNORE=/actuator/**
      - OTEL_SERVICE_NAME=incident-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_TRACES_EXPORTER=otlp
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/path: /actuator/prometheus
      prometheus.io/port: "8082"
    depends_on:
      oracle-eu:
        condition: service_healthy
      oracle-af:
        condition: service_healthy
      oracle-us:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - cloudops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q 1F9A /proc/net/tcp6 || grep -q 1F9A /proc/net/tcp"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ═══════════════════════════════════════════════════════════════
  # NOTIFICATION SERVICE
  # ═══════════════════════════════════════════════════════════════
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//oracle-eu:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=incidents_app
      - SPRING_DATASOURCE_PASSWORD=AppIncidents2025
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=oracle.jdbc.OracleDriver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.OracleDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_FLYWAY_ENABLED=false
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8180/realms/cloudops-realm
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8180/realms/cloudops-realm/protocol/openid-connect/certs
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_KAFKA_CONSUMER_GROUP_ID=notification-service
      - SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest
      - SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER=org.apache.kafka.common.serialization.StringDeserializer
      - SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER=org.springframework.kafka.support.serializer.JsonDeserializer
      - SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES=io.cloudops.*
      - SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS=false
      - SPRING_MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME:-test@cloudops.io}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD:-testpassword}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
      - LOGGING_LEVEL_IO_CLOUDOPS=DEBUG
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=*
      - MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true
      - MANAGEMENT_SERVER_PORT=8090
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED=true
      - MANAGEMENT_HEALTH_READINESSSTATE_ENABLED=true
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_SECURITY_ENABLED=false
      - SPRING_SECURITY_IGNORE=/actuator/**
      - OTEL_SERVICE_NAME=notification-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_TRACES_EXPORTER=otlp
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/path: /actuator/prometheus
      prometheus.io/port: "8083"
    depends_on:
      oracle-eu:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - cloudops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q 1F9A /proc/net/tcp6 || grep -q 1F9A /proc/net/tcp"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ═══════════════════════════════════════════════════════════════
  # REPORTING SERVICE
  # ═══════════════════════════════════════════════════════════════
  reporting-service:
    build:
      context: .
      dockerfile: reporting-service/Dockerfile
    container_name: reporting-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//oracle-eu:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=incidents_app
      - SPRING_DATASOURCE_PASSWORD=AppIncidents2025
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=oracle.jdbc.OracleDriver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.OracleDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_FLYWAY_ENABLED=false
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8180/realms/cloudops-realm
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8180/realms/cloudops-realm/protocol/openid-connect/certs
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_KAFKA_CONSUMER_GROUP_ID=reporting-service
      - SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest
      - SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER=org.apache.kafka.common.serialization.StringDeserializer
      - SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER=org.springframework.kafka.support.serializer.JsonDeserializer
      - SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES=io.cloudops.*
      - SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS=false
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_CACHE_TYPE=redis
      - LOGGING_LEVEL_IO_CLOUDOPS=DEBUG
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=*
      - MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true
      - MANAGEMENT_SERVER_PORT=8090
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED=true
      - MANAGEMENT_HEALTH_READINESSSTATE_ENABLED=true
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_SECURITY_ENABLED=false
      - SPRING_SECURITY_IGNORE=/actuator/**
      - OTEL_SERVICE_NAME=reporting-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_TRACES_EXPORTER=otlp
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/path: /actuator/prometheus
      prometheus.io/port: "8084"
    depends_on:
      oracle-eu:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cloudops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q 1F9A /proc/net/tcp6 || grep -q 1F9A /proc/net/tcp"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ═══════════════════════════════════════════════════════════════
  # API GATEWAY
  # ═══════════════════════════════════════════════════════════════
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8180/realms/cloudops-realm
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8180/realms/cloudops-realm/protocol/openid-connect/certs
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=*
      - MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true
      - MANAGEMENT_SERVER_PORT=8090
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED=true
      - MANAGEMENT_HEALTH_READINESSSTATE_ENABLED=true
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_SECURITY_ENABLED=false
      - SPRING_SECURITY_IGNORE=/actuator/**
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_TRACES_EXPORTER=otlp
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/path: /actuator/prometheus
      prometheus.io/port: "8080"
    depends_on:
      keycloak:
        condition: service_healthy
      incident-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
    networks:
      - cloudops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q 1F9A /proc/net/tcp6 || grep -q 1F9A /proc/net/tcp"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════
  # PROMETHEUS
  # ═══════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.49.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./helm/monitoring/prometheus-docker.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-lifecycle
    networks:
      - cloudops-network
    depends_on:
      - kafka-jmx-exporter
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════
  # LOKI
  # ═══════════════════════════════════════════════════════════════
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    user: "root"
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./helm/monitoring/loki-docker.yml:/etc/loki/loki-docker.yml:ro
    command: -config.file=/etc/loki/loki-docker.yml
    networks:
      - cloudops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════
  # PROMTAIL
  # ═══════════════════════════════════════════════════════════════
  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./helm/monitoring/promtail-docker.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - cloudops-network
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # JAEGER
  # ═══════════════════════════════════════════════════════════════
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "14250:14250"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
    networks:
      - cloudops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════
  # GRAFANA
  # ═══════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:10.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/cloudops/cloudops-dashboard.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./helm/monitoring/dashboards:/var/lib/grafana/dashboards/cloudops:ro
      - ./helm/monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    networks:
      - cloudops-network
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

# ═══════════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════════
volumes:
  oracle-eu-data:
  oracle-af-data:
  oracle-us-data:
  keycloak-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:

# ═══════════════════════════════════════════════════════════════
# NETWORKS
# ═══════════════════════════════════════════════════════════════
networks:
  cloudops-network:
    driver: bridge