server:
  port: 8082

spring:
  application:
    name: incident-service

  datasource:
    url: jdbc:postgresql://localhost:5432/cloudops
    username: incidents_app
    password: AppIncidents2025
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: IncidentPool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8180/realms/cloudops-realm/protocol/openid-connect/certs
          issuer-uri: http://keycloak:8180/realms/cloudops-realm

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# ─── Resilience4j ─────────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      kafkaProducer:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
        sliding-window-type: COUNT_BASED

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
  show-actuator: false

logging:
  level:
    io.cloudops: DEBUG
    org.flywaydb: INFO
    com.zaxxer.hikari: INFO

# ─── Docker Profile ───────────────────────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://postgres:5432/cloudops

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8180/realms/cloudops-realm/protocol/openid-connect/certs
          issuer-uri: http://keycloak:8180/realms/cloudops-realm

  kafka:
    bootstrap-servers: kafka:9092

# ─── Local Profile ────────────────────────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/cloudops

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8180/realms/cloudops-realm/protocol/openid-connect/certs
          issuer-uri: http://localhost:8180/realms/cloudops-realm

  kafka:
    bootstrap-servers: localhost:29092
