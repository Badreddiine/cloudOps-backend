server:
  port: 8080

spring:
  application:
    name: api-gateway

  # Configuration par défaut (Docker)
  config:
    activate:
      on-profile: docker

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8180/realms/cloudops-realm/protocol/openid-connect/certs

  cloud:
    gateway:
      globalcors:
        # TRÈS IMPORTANT : Permet de gérer les requêtes OPTIONS (Preflight) automatiquement
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # ─── Reporting Service ────────────────────────────────────────────
        - id: reporting-service
          uri: http://reporting-service:8084
          predicates:
            - Path=/api/reporting/**
          filters:
            - TokenRelay=
            # RETAIN_FIRST évite d'avoir des doublons d'headers CORS si le microservice en envoie aussi
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST
          metadata:
            response-timeout: 30000
            connect-timeout: 5000

        # ─── Incident Service ─────────────────────────────────────────────
        - id: incident-service
          uri: http://incident-service:8082
          predicates:
            - Path=/api/incidents/**
          filters:
            - TokenRelay=
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST

        # ─── Notification Service ─────────────────────────────────────────
        - id: notification-service
          uri: http://notification-service:8083
          predicates:
            - Path=/api/notifications/**
          filters:
            - TokenRelay=
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST

        # ─── WebSocket STOMP ──────────────────────────────────────────────
        - id: notification-websocket
          uri: ws://notification-service:8083
          predicates:
            - Path=/ws/**
          filters:
            - TokenRelay=

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG

---
